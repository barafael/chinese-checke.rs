name: Deploy to GitHub Pages

# `linkme` has no wasm32 implementation, so web builds get their law registry
# from the generated array in checkers-core/src/laws_generated.rs instead. That
# file is a derivative of the native link-time collection and can go stale, so
# this workflow refuses to deploy a board whose registry disagrees with the
# linker — see the "law registry" step below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install trunk
        run: |
          curl -LsSf https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin

      # Fail the deploy rather than shipping a board that cannot validate itself.
      #
      # This runs natively, where `linkme` works, so it is the last point at
      # which the generated wasm registry can be compared against the authority
      # it was derived from. `--check-registry` catches a stale file and
      # `laws_are_registered` catches a slice stripped by LTO; without both, the
      # web build could come up with a short registry and still report success.
      - name: The wasm law registry matches the linker
        run: |
          cargo run -p checkers-spec-gen -- --check-registry
          cargo test -p checkers-core --lib

      - name: Build
        env:
          # Peer introduction only; moves travel peer-to-peer. Set the
          # MATCHBOX_SERVER repository variable to point at your own instance.
          MATCHBOX_SERVER: ${{ vars.MATCHBOX_SERVER || 'wss://omdurman-matchbox.fly.dev' }}
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
