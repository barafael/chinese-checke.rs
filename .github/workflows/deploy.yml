name: Deploy to GitHub Pages

# BLOCKED: this workflow cannot succeed yet, and is deliberately not triggered
# on push so it does not report a red main branch for a known reason.
#
# `linkme` — the distributed slice the law registry is built on — has no
# wasm32-unknown-unknown implementation: `cargo check -p checkers-core --target
# wasm32-unknown-unknown` fails with "distributed_slice is not implemented for
# this platform". That is the whole workspace, not just the app, so there is
# nothing to deploy until link-time registration is replaced on that target.
#
# Fixing it means giving up compile-time-guaranteed registration or making the
# registry conditional (e.g. an inventory-style ctor on wasm, or a generated
# const array behind a cfg). Both weaken the property that a declared law
# cannot go unchecked, so it is a real design decision rather than a build fix.
#
# Kept here, runnable by hand, so the Pages/Trunk setup is ready the day the
# registry works on wasm.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install trunk
        run: |
          curl -LsSf https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C ~/.cargo/bin

      # Fail the deploy rather than shipping a board that cannot validate
      # itself. `laws_are_registered` also catches a linkme slice stripped by
      # LTO, which would otherwise leave verify_all() checking nothing.
      - name: Verify the law registry
        run: cargo test -p checkers-core --lib

      - name: Build
        env:
          # Peer introduction only; moves travel peer-to-peer. Set the
          # MATCHBOX_SERVER repository variable to point at your own instance.
          MATCHBOX_SERVER: ${{ vars.MATCHBOX_SERVER || 'wss://omdurman-matchbox.fly.dev' }}
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
