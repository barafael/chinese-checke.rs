name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Bevy links native windowing, audio, and input on Linux. omdurman's
      # workflow installs nothing because it only ever builds for wasm, which
      # links none of this — so this list is not inherited from there. Without
      # libwayland-dev the `wayland-sys` build script fails pkg-config lookup and
      # the whole workspace stops compiling.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # The generated specification must match the laws it was generated from.
      # Without this gate the document silently drifts from the code, which is
      # the one failure this whole design exists to prevent.
      - name: Specification is up to date
        run: cargo run -p checkers-spec-gen -- --check specs/specification.md

      # `.cargo/config.toml` already sets rustdocflags; RUSTDOCFLAGS *replaces*
      # that rather than adding to it, so the header has to be repeated here.
      - name: Rustdoc builds without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: --html-in-header assets/katex-header.html -D warnings

  # Tracks the GitHub Pages blocker (see deploy.yml): `linkme` has no wasm32
  # implementation, so the whole workspace fails to build for the web. This job
  # is expected to fail today; it exists so that when the registry gains wasm
  # support — or is replaced — CI says so instead of the knowledge being lost in
  # a comment.
  wasm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # No apt packages: checkers-core has no Bevy dependency, so nothing here
      # links native windowing.
      - name: Does the law registry build for the web yet?
        run: cargo check -p checkers-core --target wasm32-unknown-unknown

  # Kani cannot run on Windows and is slow, so the geometry proofs are checked
  # here rather than in the pre-commit hook. Separate job: it is much slower
  # than the rest and should not hold up the fast feedback above.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Verify the geometry proofs
        run: cargo kani -p checkers-core
