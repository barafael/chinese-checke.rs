name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Bevy links native windowing, audio, and input on Linux. omdurman's
      # workflow installs nothing because it only ever builds for wasm, which
      # links none of this — so this list is not inherited from there. Without
      # libwayland-dev the `wayland-sys` build script fails pkg-config lookup and
      # the whole workspace stops compiling.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      # Both generated artefacts must match the registry they came from. Without
      # these gates the document and the wasm registry silently drift from the
      # code, which is the one failure this whole design exists to prevent.
      - name: Specification is up to date
        run: cargo run -p checkers-spec-gen -- --check specs/specification.md

      - name: The wasm law registry is up to date
        run: cargo run -p checkers-spec-gen -- --check-registry

      # `.cargo/config.toml` already sets rustdocflags; RUSTDOCFLAGS *replaces*
      # that rather than adding to it, so the header has to be repeated here.
      - name: Rustdoc builds without warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: --html-in-header assets/katex-header.html -D warnings

  # The web target is a real gate now that the generated registry stands in for
  # `linkme`, which has no wasm32 implementation. Checks the whole app, not just
  # the core: `wasm32` is the only target where the generated array is compiled
  # at all, so a malformed one is invisible everywhere else.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      # No apt packages: nothing in a wasm build links native windowing.
      - name: Build for the web
        run: cargo check -p checkers-bevy --target wasm32-unknown-unknown

  # Kani cannot run on Windows and is slow, so the geometry proofs are checked
  # here rather than in the pre-commit hook. Separate job: it is much slower
  # than the rest and should not hold up the fast feedback above.
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Verify the geometry proofs
        run: cargo kani -p checkers-core
