[build]
# rustdoc has no native math support: it strips \(...\) and passes $$ through as
# literal text. Injecting KaTeX's auto-render into every page's <head> is the
# only way to get rendered math in rustdoc output.
#
# NOTE: this must be a rustdoc *flag*. `#![doc(html_in_header = ...)]` as a crate
# attribute is rejected by cargo ("unknown doc attribute").
#
# `-D warnings` matches what CI enforces. Without it a broken intra-doc link is
# a local warning and a CI failure, which is the wrong way round: two doc links
# reached main that way. Note RUSTDOCFLAGS in the environment *replaces* this
# list rather than extending it, so CI repeats the header path.
rustdocflags = [
    "--html-in-header",
    "assets/katex-header.html",
    "-D",
    "warnings",
]
