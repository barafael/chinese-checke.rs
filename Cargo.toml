[workspace]
resolver = "3"
members = ["checkers-core", "checkers-model", "checkers-spec-gen"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
checkers-core = { path = "checkers-core" }
checkers-model = { path = "checkers-model" }
linkme = "0.3"
proptest = "1"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
# `kani` is set by cargo-kani, which is not a Cargo feature. Declaring it keeps
# ordinary builds warning-free, including on Windows where Kani cannot install.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
