[workspace]
resolver = "3"
members = ["checkers-bevy","checkers-core", "checkers-model", "checkers-net", "checkers-spec-gen"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
checkers-core = { path = "checkers-core" }
checkers-model = { path = "checkers-model" }
checkers-net = { path = "checkers-net" }
linkme = "0.3"
proptest = "1"

bevy = "0.19"
# Pinned to the same fork omdurman uses: the crates.io release does not yet
# support Bevy 0.19.
bevy_matchbox = { git = "https://github.com/barafael/matchbox.git" }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
# `kani` is set by cargo-kani, which is not a Cargo feature. Declaring it keeps
# ordinary builds warning-free, including on Windows where Kani cannot install.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
