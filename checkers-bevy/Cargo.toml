[package]
name = "checkers-bevy"
edition.workspace = true
version.workspace = true
description = "Bevy front-end for the machine-checked Chinese Checkers rules"

[dependencies]
bevy.workspace = true
bevy_matchbox.workspace = true
checkers-ai.workspace = true
checkers-core.workspace = true
checkers-net.workspace = true

# `PeerId` is a newtype over `Uuid` with no `FromStr`, so constructing a
# placeholder peer for the lobby tests needs the crate directly. Already in the
# tree via matchbox, so this adds no build.
[dev-dependencies]
uuid = "1"

# The live multiplayer integration test (`tests/multiplayer.rs`) hosts an
# in-process full-mesh signaling server to introduce the real peers. It comes
# from the same matchbox fork as bevy_matchbox (the workspace's git source, so
# Cargo.lock pins both to one commit): the fork's server tells two peers that
# join a room at the same moment of each other, which the published crate's
# does not. Test-only: the app itself never runs a signaling server.
matchbox_signaling = { git = "https://github.com/barafael/matchbox.git", branch = "main" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

# Saving and opening `.cchkrs` rounds through a file dialog. Web builds use
# localStorage instead, so the dialog crate is native-only.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rfd = "0.18"

# The agent interface (see `src/agent.rs`): a localhost socket an external
# script drives the window through — screenshots, clicks, keys, game state.
# All four are already in the tree via Bevy and its test/dev graph, so these
# add no new builds; `image` only turns on its PNG codec.
serde.workspace = true
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

# Reading and sharing the room name through the URL fragment (web only), and
# the localStorage slot a saved round lives in.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["History", "Location", "Window", "Storage"] }
js-sys = "0.3"
