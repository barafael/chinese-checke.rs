[package]
name = "checkers-bevy"
edition.workspace = true
version.workspace = true
description = "Bevy front-end for the machine-checked Chinese Checkers rules"

[dependencies]
bevy.workspace = true
bevy_matchbox.workspace = true
checkers-ai.workspace = true
checkers-core.workspace = true
checkers-net.workspace = true

# `PeerId` is a newtype over `Uuid` with no `FromStr`, so constructing a
# placeholder peer for the lobby tests needs the crate directly. Already in the
# tree via matchbox, so this adds no build.
[dev-dependencies]
uuid = "1"

# The live multiplayer integration test (`tests/multiplayer.rs`) hosts an
# in-process full-mesh signaling server to introduce the real peers. The repo
# builds its own copy of bevy_matchbox from a fork of matchbox, and the fork
# re-versions `matchbox_signaling` to 0.15.0 *without changing a line of
# signaling or protocol source*, so the published 0.14.0 crate on crates.io is
# byte-identical code and talks the same wire protocol. Test-only: the app
# itself never runs a signaling server.
matchbox_signaling = "0.14" # registry keeps the underscore name
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true

# Saving and opening `.cchkrs` rounds through a file dialog. Web builds use
# localStorage instead, so the dialog crate is native-only.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rfd = "0.17"

# Reading and sharing the room name through the URL fragment (web only); a
# context-menu listener so the 3D camera's right-drag orbit is not interrupted;
# and the localStorage slot a saved round lives in.
[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["Location", "Window", "EventTarget", "Storage"] }
js-sys = "0.3"
