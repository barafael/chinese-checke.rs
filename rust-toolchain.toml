# Pin the workspace to stable, matching CI (dtolnay/rust-toolchain@stable).
#
# Without this file rustup uses the machine default, which may be a nightly
# CI never builds with: a failure there, inside a dependency, would read as
# "checkers-bevy is broken" while the workspace is fine.
#
# `cargo kani` is unaffected: it exports its own pinned nightly via
# RUSTUP_TOOLCHAIN, which takes precedence over this file.
[toolchain]
channel = "stable"
